# Dependabot config template for NapticStacks repos. Copy to .github/dependabot.yml
# and delete the ecosystems the repo doesn't use. Weekly, grouped, small PRs.
# project-manager's pm-dependabot-auto-merge handles the PRs this opens.
# SAST/DAST is not here: Sugam sets that standard (naptic-sdlc#6).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      pip-minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies"]
